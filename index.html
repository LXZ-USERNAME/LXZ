<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXZ 的主页</title>
    <style>
        /* 基础设置与背景 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); /* 清新的浅色渐变 */
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px; /* 限制最大宽度，让大屏幕看起来更舒服 */
            margin: 0 auto;
        }
        
        /* 顶部标题区 */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .header h1 {
            color: #1e293b;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .header p {
            color: #64748b;
            font-size: 16px;
        }

        /* 网格布局：自动适应屏幕宽度 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* 区块卡片通用样式 */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            text-decoration: none; /* 去掉链接下划线 */
            color: inherit;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        /* 鼠标悬停时的动画 */
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }

        /* 图标和文字 */
        .card-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .card h2 {
            color: #1e293b;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .card p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        /* 占位卡片（灰色不可点击） */
        .card-placeholder {
            opacity: 0.6;
            cursor: default;
        }
        .card-placeholder:hover {
            transform: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border-color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部欢迎语 -->
        <div class="header">
            <h1>LXZ 的主页</h1>
            <p>这是为人民服务的网站，请选择您需要的功能</p>
        </div>

        <!-- 功能区块网格 -->
        <div class="grid-container">
            
            <!-- 区块 1：Java 版 MC 下载（点击跳转到 download.html） -->
            <a href="download.html" class="card">
                <div class="card-icon">🎮</div>
                <h2>Java 版 MC 下载</h2>
                <p>提供 PCL2 与 XPCL 启动器及整合包的高速下载</p>
            </a>

            <!-- 区块 2：MCJS 入口（点击跳转到外部网址 mcjs.link） -->
            <a href="https://mcjs.link" target="_blank" class="card">
                <div class="card-icon">🌐</div>
                <h2>MCJS 快捷入口</h2>
                <p>点击前往 mcjs.link 官方网址（在新窗口打开）</p>
            </a>

            <!-- 区块 3：预留位置（方便你以后添加新东西） -->
            <div class="card card-placeholder">
                <div class="card-icon">➕</div>
                <h2>更多功能</h2>
                <p>敬请期待，后续将添加更多实用工具和资源...</p>
            </div>

        </div>
    </div>

</body>
</html>
